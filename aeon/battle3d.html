<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>AEON — 3D Battle (Babylon.js POC)</title>

<!-- AEON display/UI fonts (same as the main app) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

<!--
  Babylon.js 6.x via CDN — NO build step.  Pinned to 6.49.0 (last 6.x) on
  jsDelivr so this stays a plain HTML file you can double-click or drop on
  Netlify.  The UMD bundles expose a global `BABYLON`; the loaders bundle
  registers the glTF/GLB importer used by SceneLoader.ImportMeshAsync().

  Swap for the rolling-latest 6.x at cdn.babylonjs.com if you prefer:
      https://cdn.babylonjs.com/babylon.js
      https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js
  (those track the newest release, which may move past 6.x over time).
-->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@6.49.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.49.0/babylonjs.loaders.min.js"></script>

<style>
  /* AEON palette — kept in sync with css/style.css :root */
  :root{
    --bg-deep:#0a0c12; --bg-mid:#141823; --bg-light:#1e2330; --border:#2d3344;
    --border-lt:#3a4255; --text:#d8dde8; --text-dim:#8b96ac; --text-bright:#fff;
    --accent:#d4af37; --accent-lt:#f0d066; --good:#54c27a; --bad:#e0584f;
    --side-a:#4a90e2; --side-b:#e74c3c;
    --font-display:'Cinzel',Georgia,serif; --font-ui:'Rajdhani','Segoe UI',sans-serif;
    --font-mono:'Share Tech Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);
    font-family:var(--font-ui);color:var(--text);}
  #renderCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;outline:none;}

  /* ---- HTML overlay UI (NOT in-scene) ---- */
  .ui{position:fixed;z-index:10;pointer-events:none;}
  .card{
    position:fixed;top:16px;min-width:190px;padding:12px 16px;
    background:linear-gradient(180deg,rgba(20,24,35,.92),rgba(10,12,18,.92));
    border:1px solid var(--border);border-radius:10px;backdrop-filter:blur(6px);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  #card-A{left:16px;border-top:3px solid var(--side-a);}
  #card-B{right:16px;border-top:3px solid var(--side-b);text-align:right;}
  .card .cname{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:1px;}
  .card .csub{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin:2px 0 8px;}
  .card .carmy{font-family:var(--font-mono);font-size:26px;color:var(--text-bright);line-height:1;}
  .card .carmy small{font-size:12px;color:var(--text-dim);}
  .card .cweapon{margin-top:8px;font-size:11px;letter-spacing:1px;color:var(--accent-lt);min-height:14px;}

  #banner{
    top:18px;left:50%;transform:translateX(-50%);text-align:center;
    background:rgba(10,12,18,.78);border:1px solid var(--border);
    border-left:3px solid var(--accent);border-right:3px solid var(--accent);
    padding:8px 26px;border-radius:8px;
  }
  #banner .phase{font-family:var(--font-display);font-weight:800;letter-spacing:6px;
    font-size:20px;color:var(--accent);text-transform:uppercase;}
  #banner .yr{font-size:11px;color:var(--text-dim);letter-spacing:2px;}

  #log{
    left:16px;bottom:16px;width:300px;max-height:172px;overflow:hidden;
    background:rgba(10,12,18,.72);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;font-size:12px;line-height:1.55;
  }
  #log .lt{color:var(--text-dim);}
  #log .lt b{color:var(--accent-lt);}

  #controls{
    position:fixed;z-index:11;right:16px;bottom:16px;
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto;
  }
  #controls .row{display:flex;gap:8px;align-items:center;background:rgba(10,12,18,.72);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  #controls label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);}
  #controls select{background:var(--bg-light);color:var(--text);border:1px solid var(--border);
    border-radius:5px;padding:5px 7px;font-family:var(--font-ui);font-weight:600;font-size:13px;}
  #controls .tgl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text);}
  #controls .stp{background:var(--bg-light);color:var(--text);border:1px solid var(--border);
    border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;}
  #controls .stp:hover{background:var(--bg-lift,#262c3c);border-color:var(--accent);}
  #controls .ageval{font-family:var(--font-mono);min-width:20px;text-align:center;color:var(--accent-lt);}
  #replay{font-family:var(--font-display);font-weight:700;letter-spacing:3px;cursor:pointer;
    background:linear-gradient(180deg,var(--accent-lt),var(--accent));color:#1a1407;border:none;
    padding:11px 22px;border-radius:6px;font-size:14px;box-shadow:0 6px 18px rgba(212,175,55,.3);}
  #replay:hover{transform:translateY(-1px);}

  /* Special-weapon screen flash (mirrors renderer.flashEffect in render.js) */
  #flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none;}

  #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:var(--bg-deep);}
  #loading h1{font-family:var(--font-display);font-weight:800;letter-spacing:14px;font-size:54px;
    color:var(--accent);text-shadow:0 0 30px rgba(212,175,55,.4);}
  #loading p{color:var(--text-dim);letter-spacing:2px;font-size:13px;}
  .hidden{display:none!important;}

  @media (max-width:640px){
    .card{min-width:140px;padding:9px 11px;top:10px;}
    #card-A{left:10px;} #card-B{right:10px;}
    .card .carmy{font-size:20px;} .card .cname{font-size:15px;}
    #banner{top:96px;padding:6px 16px;} #banner .phase{font-size:15px;letter-spacing:4px;}
    #log{width:46%;bottom:10px;left:10px;max-height:120px;font-size:11px;}
    #controls{bottom:10px;right:10px;}
  }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- ============ HTML OVERLAY ============ -->
<div class="ui card" id="card-A">
  <div class="cname" id="A-name">Side A</div>
  <div class="csub" id="A-sub">—</div>
  <div class="carmy"><span id="A-army">0</span> <small>troops</small></div>
  <div class="cweapon" id="A-weapon"></div>
</div>
<div class="ui card" id="card-B">
  <div class="cname" id="B-name">Side B</div>
  <div class="csub" id="B-sub">—</div>
  <div class="carmy"><span id="B-army">0</span> <small>troops</small></div>
  <div class="cweapon" id="B-weapon"></div>
</div>

<div class="ui card" id="banner">
  <div class="phase" id="phase">Spawn</div>
  <div class="yr" id="yr">FINAL BATTLE</div>
</div>

<div class="ui" id="log"></div>

<div id="controls">
  <div class="row">
    <label>A biome</label><select id="biomeSelA"></select>
    <label>B biome</label><select id="biomeSelB"></select>
  </div>
  <div class="row">
    <label>A age</label>
    <button class="stp" data-age="A" data-d="-1">−</button><span class="ageval" id="ageA">3</span><button class="stp" data-age="A" data-d="1">+</button>
    <label>B age</label>
    <button class="stp" data-age="B" data-d="-1">−</button><span class="ageval" id="ageB">5</span><button class="stp" data-age="B" data-d="1">+</button>
  </div>
  <div class="row">
    <span class="tgl"><input type="checkbox" id="wA" checked /> A weapon</span>
    <span class="tgl"><input type="checkbox" id="wB" /> B weapon</span>
  </div>
  <button id="replay">⚔ Replay Battle</button>
</div>

<div id="flash"></div>

<div id="loading">
  <h1>AEON</h1>
  <p id="loadmsg">Initialising 3D battle…</p>
</div>

<script>
/* ============================================================================
 *  AEON · battle3d.html  —  Babylon.js 3D Battle Visualiser  (PROOF OF CONCEPT)
 * ============================================================================
 *
 *  WHAT THIS IS
 *  ------------
 *  A standalone, no-build demo of a Babylon.js replacement for the 2D-canvas
 *  `BattleVisualizer` in js/battle.js.  It runs entirely on its own with a
 *  MOCK battle outcome so you can iterate on the 3D look in isolation.  It does
 *  NOT import or modify any AEON file.
 *
 *  INTEGRATION PATH  (how this eventually plugs into the live sim)
 *  --------------------------------------------------------------
 *  Today, js/main.js → startBattle() does:
 *
 *      Game.battleOutcome = Game.civC
 *        ? resolveBattle3(civA, civB, civC, world, rng)
 *        : resolveBattle(civA, civB, world, rng);
 *      Game.battle = new BattleVisualizer(Game.renderer, Game.map, Game.civs, Game.battleOutcome);
 *      Game.battle.start();
 *
 *  To switch to 3D, this file becomes (roughly) a `Battle3D` module exporting
 *  the SAME surface the orchestrator already expects, so main.js barely changes:
 *
 *      Game.battle = new Battle3D({
 *        canvas:  someCanvas,          // a dedicated <canvas> (or reuse #map-canvas)
 *        civs:    Game.civs,           // each civ: army,color,name,side,focus,race,weapon,weaponUnlocked
 *        outcome: Game.battleOutcome,  // the object returned by resolveBattle()/resolveBattle3()
 *        biome:   config.A.biome,      // biome key from BIOMES for the ground
 *      });
 *      Game.battle.start();
 *
 *  Battle3D keeps the orchestrator's existing contract:
 *      • .start()      — spawn armies, begin the phase machine
 *      • .isDone()     — true once phase === 'done'  (battleStep() polls this)
 *      • .battleLog    — [{year,text}] array consumed by finishGame() for the aftermath
 *  Instead of being stepped from main.js's gameLoop(), Battle3D owns its own
 *  engine.runRenderLoop(); when it finishes it calls an onDone() callback that
 *  the orchestrator wires to finishGame().  The 2D Renderer is simply hidden
 *  (or its canvas swapped out) while the 3D battle plays, then the aftermath
 *  screen shows exactly as it does now.
 *
 *  Load Babylon lazily (inject these <script> tags only when the first battle
 *  starts) so the ~3 MB engine never burdens the sim itself.
 *
 *  EVERY place real sim data is consumed is tagged `// AEON_DATA_HOOK:`.
 * ============================================================================ */

(function () {
  'use strict';

  if (typeof BABYLON === 'undefined') {
    document.getElementById('loadmsg').textContent =
      'Babylon.js failed to load from CDN (check your network / the <script> URLs).';
    return;
  }
  const B = BABYLON;
  const $ = (id) => document.getElementById(id);

  /* ------------------------------------------------------------------------ *
   * AEON_DATA_HOOK: biome palette.
   * Verbatim copy of the `color / colorAlt / feature` triples from BIOMES in
   * js/data.js.  In the integrated build, delete this table and read the live
   * `BIOMES[biomeKey]` global instead (it carries the same fields).
   * ------------------------------------------------------------------------ */
  const BIOME_COLORS = {
    forest:      { base:'#2d5a3a', alt:'#3a6b47', feature:'#4a7a55' },
    mountain:    { base:'#5a5a5a', alt:'#6b6b6b', feature:'#888888' },
    desert:      { base:'#c9a96b', alt:'#d6b878', feature:'#a8893f' },
    tundra:      { base:'#a8b5c4', alt:'#bcc6d1', feature:'#e0e6ec' },
    plains:      { base:'#7a9a5a', alt:'#8aaa6a', feature:'#a0c073' },
    swamp:       { base:'#4a5a3a', alt:'#556a45', feature:'#6a7d4a' },
    coastal:     { base:'#5a8a6a', alt:'#6a9a78', feature:'#d8c56a' },
    volcanic:    { base:'#4a3232', alt:'#5a3c3c', feature:'#c43a1a' },
    jungle:      { base:'#1f4d2b', alt:'#286038', feature:'#3f8a4a' },
    savanna:     { base:'#9a8a4a', alt:'#aa9a55', feature:'#c0b070' },
    steppe:      { base:'#8a8a5a', alt:'#999a6a', feature:'#b0b080' },
    highlands:   { base:'#4a6a4a', alt:'#557a55', feature:'#6a8a5a' },
    archipelago: { base:'#4a8a7a', alt:'#56998a', feature:'#d4c898' },
    badlands:    { base:'#8a5a3a', alt:'#9a6a45', feature:'#b07a4a' },
    taiga:       { base:'#3a5048', alt:'#445a50', feature:'#5a7060' },
  };

  /* ------------------------------------------------------------------------ *
   * AEON_DATA_HOOK: focus → unit-type distribution.
   * Mirrors the `focusPools` map in createUnit() (js/battle.js).  Used to give
   * each army a silhouette mix (infantry / cavalry / archer / mage).
   * ------------------------------------------------------------------------ */
  const FOCUS_UNIT_POOLS = {
    military:    ['infantry','infantry','infantry','cavalry'],
    science:     ['archer','archer','mage','infantry'],
    faith:       ['infantry','infantry','mage','mage'],
    magic:       ['mage','mage','mage','archer'],
    industry:    ['infantry','infantry','cavalry','infantry'],
    trade:       ['archer','infantry','infantry'],
    naturalism:  ['archer','cavalry','infantry'],
    exploration: ['cavalry','cavalry','archer','infantry'],
    diplomacy:   ['infantry','archer'],
  };

  /* ------------------------------------------------------------------------ *
   * AEON_DATA_HOOK: civs + outcome.
   * These two civs and the `outcome` object below STAND IN FOR the real ones.
   * In the live build, `civs` come straight from Game.civs and `outcome` is the
   * exact object returned by resolveBattle():
   *
   *   { invader, defender, winner, loser,
   *     invPower, defPower, invRoll, defRoll,
   *     invBreakdown, defBreakdown,
   *     winnerCasualtyPct, loserCasualtyPct }
   *
   * Each civ carries: army(int), color(hex), name, side('A'|'B'|'C'),
   *                   focus, race, weapon, weaponUnlocked, techAge(0-11), biome.
   * (resolveBattle3() returns a `threeWay:true` variant with an `entries[]`
   *  array — see the note in Battle3D.start() for the 1v1v1 hook.)
   * ------------------------------------------------------------------------ */
  const civA = { name:'Aurelian Pact', color:'#4a90e2', side:'A',
                 race:'humans', focus:'science', weapon:'Trebuchet Corps',
                 weaponUnlocked:true,  army:14200, techAge:3, biome:'forest' };
  const civB = { name:'Ironhold Clans', color:'#e74c3c', side:'B',
                 race:'orcs', focus:'military', weapon:'Iron Legion',
                 weaponUnlocked:false, army:11800, techAge:5, biome:'mountain' };

  // Stand-in for resolveBattle(): whoever has the larger (army) here "wins".
  // The real engine factors power/roll/breakdowns — we only need winner/loser
  // and the casualty fractions for the visualisation.
  function buildOutcome(a, b) {
    const aWins = a.army >= b.army;
    const winner = aWins ? a : b, loser = aWins ? b : a;
    return {
      invader:a, defender:b, winner, loser,
      invPower:a.army, defPower:b.army, invRoll:1, defRoll:1,
      invBreakdown:{}, defBreakdown:{},
      // AEON_DATA_HOOK: in the real outcome these come from the battle resolver.
      winnerCasualtyPct: 0.22 + Math.random()*0.14,   // winner is bloodied…
      loserCasualtyPct:  1.0,                          // …loser is wiped out
    };
  }
  let outcome = buildOutcome(civA, civB);

  /* ------------------------------------------------------------------------ *
   * Engine / scene globals
   * ------------------------------------------------------------------------ */
  let engine, scene, camera, hemi, dirLight, shadowGen, glow, ground, groundMat;
  let particleTex = null;          // soft round sprite for all ParticleSystems
  let soldierTmpl = null;          // { isPlaceholder, glbRoot?, animationGroups? }
  let buildingTmpl = null;         // { isPlaceholder, glbRoot? }
  let mageOrbSrc = null;           // shared emissive sphere (instanced for mages)
  let battle = null;
  let currentBiome = 'forest';     // AEON_DATA_HOOK: default ground biome (#2d5a3a)

  // small utils
  const hexC3 = (hex) => B.Color3.FromHexString(hex);
  const col4  = (hex, a) => { const c = hexC3(hex); return new B.Color4(c.r, c.g, c.b, a == null ? 1 : a); };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function formatNum(n) {                       // mirrors formatNum() in battle.js
    if (!isFinite(n)) return '∞';
    const a = Math.abs(n);
    if (a >= 1e9) return (n/1e9).toFixed(1)+'B';
    if (a >= 1e6) return (n/1e6).toFixed(1)+'M';
    if (a >= 1e3) return (n/1e3).toFixed(1)+'K';
    return '' + Math.round(n);
  }

  /* ========================================================================
   *  SCENE SETUP
   * ====================================================================== */
  function createScene() {
    engine = new B.Engine($('renderCanvas'), true, { stencil:true, preserveDrawingBuffer:true });
    scene  = new B.Scene(engine);
    scene.clearColor = col4('#0a0c12', 1);                 // AEON --bg-deep
    // Atmospheric depth so distant ranks fade into the night.
    scene.fogMode = B.Scene.FOGMODE_LINEAR;
    scene.fogColor = hexC3('#0a0c12');
    scene.fogStart = 26; scene.fogEnd = 60;

    // ---- Camera: ArcRotate pulled back to frame the wider 40×20 field
    camera = new B.ArcRotateCamera('cam', -Math.PI/2, 1.02, 28, new B.Vector3(0, 1.2, 0), scene);
    camera.attachControl($('renderCanvas'), true);
    camera.lowerRadiusLimit = 12;
    camera.upperRadiusLimit = 64;
    camera.lowerBetaLimit   = 0.20;
    camera.upperBetaLimit   = 1.46;                        // don't drop under the ground
    camera.wheelDeltaPercentage = 0.01;
    camera.panningSensibility   = 0;                       // lock panning for a stable framing

    // ---- Lights: hemispheric ambient + one directional (the shadow caster)
    hemi = new B.HemisphericLight('hemi', new B.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.55;
    hemi.groundColor = hexC3('#10141d');

    dirLight = new B.DirectionalLight('sun', new B.Vector3(-0.6, -1, 0.45), scene);
    dirLight.position = new B.Vector3(22, 42, -18);
    dirLight.intensity = 0.95;

    // ---- Shadows.  PERFORMANCE: 1024 map is plenty for a single field.
    //   For 200+ soldiers we add the *instance source* meshes (and buildings)
    //   to the caster list — every InstancedMesh then casts a shadow for free,
    //   so the caster count stays ~3 regardless of army size.  If you push past
    //   that, drop to 512, prefer useExponentialShadowMap (no blur), and/or only
    //   register front-rank casters.
    shadowGen = new B.ShadowGenerator(1024, dirLight);
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 16;
    shadowGen.darkness = 0.55;

    // Glow makes mage orbs and the special-weapon FX read at distance.
    glow = new B.GlowLayer('glow', scene);
    glow.intensity = 0.7;

    particleTex = makeSoftParticleTexture();

    // Shared mage-orb source (emissive). Instanced per mage; never drawn itself.
    mageOrbSrc = B.MeshBuilder.CreateSphere('mageOrbSrc', { diameter:0.34, segments:6 }, scene);
    const om = new B.StandardMaterial('mageOrbMat', scene);
    om.emissiveColor = hexC3('#bfe6ff'); om.diffuseColor = hexC3('#bfe6ff');
    om.disableLighting = true;
    mageOrbSrc.material = om; mageOrbSrc.isVisible = false; mageOrbSrc.isPickable = false;

    // UPGRADE 3: terrain (per-side biomes) is built in startBattle3D once the
    // civs (and therefore civ.biome) are known.
  }

  // 64×64 radial-alpha sprite, generated in-code so we ship zero image assets.
  function makeSoftParticleTexture() {
    const dt = new B.DynamicTexture('soft', { width:64, height:64 }, scene, false);
    const ctx = dt.getContext();
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
    dt.hasAlpha = true; dt.update();
    return dt;
  }

  /* ========================================================================
   *  UPGRADE 3 — BIOME TERRAIN
   *  A 40×20 field split into two 20×20 GroundMesh halves at x=0. Left half =
   *  Side A biome, right half = Side B biome (AEON_DATA_HOOK: civ.biome). Each
   *  half gets per-biome vertex height + vertex colours, a colour blend across
   *  the contested border, instanced decorations (capped at 200), and EXP2 fog
   *  blending the two biome colours.
   * ====================================================================== */
  let terrain = null;          // { grounds, decoSrc, deco, mats, ps, anims, … }
  const TERRAIN_DECO_CAP = 200;

  function biomeHeight(biome, x, z) {
    const n = Math.sin(x*1.3 + z*0.7) * Math.cos(z*1.1 - x*0.5);   // pseudo-noise ~[-1,1]
    switch (biome) {
      case 'mountain': return n * 0.8;
      case 'volcanic': return n * 1.0;
      case 'desert':   return Math.sin(x*0.6)*0.15 + Math.sin(z*0.55)*0.15;   // dunes ±0.3
      case 'plains':   return n * 0.1;
      case 'tundra':   return n * 0.06;
      case 'swamp':
      case 'coastal':  return 0;
      case 'forest':
      case 'jungle':
      case 'taiga':    return n * 0.2;
      case 'savanna':  return n * 0.12;
      default:         return n * 0.15;
    }
  }

  function buildTerrain(biomeA, biomeB) {                  // AEON_DATA_HOOK: civ.biome × 2
    disposeTerrain();
    terrain = { grounds:[], decoSrc:[], decoSrcCache:{}, deco:[], mats:[], ps:[], anims:[],
                decoCount:0, texN:0, t:0 };
    const palA = BIOME_COLORS[biomeA] || BIOME_COLORS.forest;
    const palB = BIOME_COLORS[biomeB] || BIOME_COLORS.forest;
    buildHalf(biomeA, palA, palB, -1);                    // Side A → left  (x -20..0)
    buildHalf(biomeB, palB, palA, +1);                    // Side B → right (x  0..20)

    // EXP2 fog blending the two biome colours
    scene.fogMode = B.Scene.FOGMODE_EXP2;
    scene.fogColor = mix(hexC3(palA.base), hexC3(palB.base), 0.5);
    scene.fogDensity = 0.011;
  }

  function buildHalf(biome, pal, otherPal, side) {
    const g = B.MeshBuilder.CreateGround('half'+side, { width:20, height:20, subdivisions:28 }, scene);
    g.position.x = side * 10;
    g.receiveShadows = true;

    // manual vertex height + per-vertex biome colour (blended near the seam)
    const positions = g.getVerticesData(B.VertexBuffer.PositionKind);
    const indices = g.getIndices();
    const normals = [];
    const colors = new Array((positions.length/3) * 4);
    const baseC = hexC3(pal.base), otherC = hexC3(otherPal.base);
    for (let i = 0, c = 0; i < positions.length; i += 3, c += 4) {
      const lx = positions[i], lz = positions[i+2], wx = lx + side*10;
      positions[i+1] = biomeHeight(biome, wx, lz) * clamp(Math.abs(wx)/3, 0, 1);   // flat at border
      const d = Math.abs(wx);
      const col = d < 2.5 ? mix(baseC, otherC, (1 - d/2.5) * 0.5) : baseC;          // 5-wide blend strip
      colors[c] = col.r; colors[c+1] = col.g; colors[c+2] = col.b; colors[c+3] = 1;
    }
    B.VertexData.ComputeNormals(positions, indices, normals);
    g.setVerticesData(B.VertexBuffer.PositionKind, positions);
    g.setVerticesData(B.VertexBuffer.NormalKind, normals);
    g.setVerticesData(B.VertexBuffer.ColorKind, colors);
    g.useVertexColors = true;
    g.refreshBoundingInfo();

    const mat = stdMat('halfMat'+side, new B.Color3(1,1,1));
    mat.specularColor = new B.Color3(0.03, 0.03, 0.04);
    const detail = makeDetailTexture(); detail.uScale = 5; detail.vScale = 5;
    mat.diffuseTexture = detail;                          // grayscale grain × vertex colour
    g.material = mat;

    terrain.grounds.push(g); terrain.mats.push(mat);
    if (biome === 'desert') terrain.anims.push({ type:'shimmer', tex:detail });   // heat-shimmer UV scroll
    scatterBiome(biome, side, pal);
  }

  // shared grayscale grain texture (one per half so desert can scroll its own)
  function makeDetailTexture() {
    const S = 256;
    const dt = new B.DynamicTexture('detail'+(terrain.texN++), { width:S, height:S }, scene, true);
    const ctx = dt.getContext();
    ctx.fillStyle = '#bcbcbc'; ctx.fillRect(0, 0, S, S);
    for (let i = 0; i < 1300; i++) {
      const v = 150 + Math.floor(Math.random()*90);
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      const s = 1 + Math.random()*4;
      ctx.fillRect(Math.random()*S, Math.random()*S, s, s);
    }
    dt.update(); dt.wrapU = dt.wrapV = B.Texture.WRAP_ADDRESSMODE;
    return dt;
  }

  // ---- instanced decoration scatter (PERFORMANCE: shared sources + 200 cap) ----
  function getDecoSrc(key, build, castShadow) {
    if (!terrain.decoSrcCache[key]) {
      const m = build();
      m.isVisible = false; m.isPickable = false; m.position.y = -50;
      if (castShadow) shadowGen.addShadowCaster(m);
      if (m.material) terrain.mats.push(m.material);
      terrain.decoSrc.push(m);
      terrain.decoSrcCache[key] = m;
    }
    return terrain.decoSrcCache[key];
  }
  function placeDeco(key, build, x, y, z, opts) {
    if (terrain.decoCount >= TERRAIN_DECO_CAP) return null;   // hard cap on instances
    const src = getDecoSrc(key, build, opts && opts.shadow);
    const inst = src.createInstance('deco'+(terrain.decoCount++));
    inst.position.set(x, y, z);
    if (opts && opts.scale) inst.scaling.copyFrom(opts.scale);
    if (opts && opts.rot)   inst.rotation.copyFrom(opts.rot);
    terrain.deco.push(inst);
    return inst;
  }

  function makeWater(pos, size, hex) {
    const w = B.MeshBuilder.CreateGround('water', { width:size, height:size }, scene);
    const m = stdMat('waterM', hexC3(hex));
    m.alpha = 0.72; m.specularColor = new B.Color3(0.6,0.7,0.8); m.specularPower = 64;
    w.material = m; w.position.copyFrom(pos);
    terrain.deco.push(w); terrain.mats.push(m);
    terrain.anims.push({ type:'water', mesh:w, baseY:pos.y, ph:Math.random()*6 });
    return w;
  }
  function makeFlame(pos) {
    const ps = new B.ParticleSystem('flame', 40, scene);
    ps.particleTexture = particleTex; ps.emitter = pos.clone();
    ps.minEmitBox = new B.Vector3(-0.15,0,-0.15); ps.maxEmitBox = new B.Vector3(0.15,0.1,0.15);
    ps.color1 = col4('#ffb03a',0.9); ps.color2 = col4('#ff4a1a',0.9); ps.colorDead = col4('#5a1a0a',0);
    ps.minSize = 0.2; ps.maxSize = 0.6; ps.minLifeTime = 0.3; ps.maxLifeTime = 0.7;
    ps.emitRate = 40; ps.minEmitPower = 0.6; ps.maxEmitPower = 1.6; ps.gravity = new B.Vector3(0,2,0);
    ps.blendMode = B.ParticleSystem.BLENDMODE_ADD; ps.start();
    return ps;
  }

  function scatterBiome(biome, side, pal) {
    const xc = side * 10, featC = hexC3(pal.feature);
    const rndX = () => xc + (Math.random()*2-1)*9;
    const rndZ = () => (Math.random()*2-1)*9;
    const yAt  = (x,z) => biomeHeight(biome, x, z) * clamp(Math.abs(x)/3, 0, 1);
    const jit  = () => new B.Vector3(0.9+Math.random()*0.4, 0.9+Math.random()*0.5, 0.9+Math.random()*0.4);
    const trunkB  = () => { const m=B.MeshBuilder.CreateCylinder('trunkS',{height:0.8,diameter:0.28,tessellation:6},scene); m.material=stdMat('trunkM',hexC3('#5a3f29')); return m; };
    const rockB   = (h) => () => { const m=B.MeshBuilder.CreateBox('rockS',{size:0.5},scene); m.material=stdMat('rockM',hexC3(h)); return m; };
    const grassB  = (h) => () => { const m=B.MeshBuilder.CreateCylinder('grassS',{height:0.3,diameter:0.08,tessellation:4},scene); m.material=stdMat('grassM',hexC3(h)); return m; };

    const tree = (key, canopyB, n) => { for (let i=0;i<n;i++){ const x=rndX(), z=rndZ(), ty=yAt(x,z);
      placeDeco('trunk', trunkB, x, ty+0.4, z, { shadow:true });
      placeDeco(key, canopyB, x, ty+0.95, z, { scale:jit() }); } };

    switch (biome) {
      case 'forest':
        tree('canopy', () => { const m=B.MeshBuilder.CreateSphere('canS',{diameter:0.6,segments:6},scene); m.material=stdMat('canM',featC); return m; }, 15);
        for (let i=0;i<6;i++){ const x=rndX(), z=rndZ(); placeDeco('stump', () => { const m=B.MeshBuilder.CreateCylinder('stumpS',{height:0.4,diameter:0.3,tessellation:6},scene); m.material=stdMat('stumpM',hexC3('#5a3f29')); return m; }, x, yAt(x,z)+0.2, z); }
        break;
      case 'jungle':
        tree('jcan', () => { const m=B.MeshBuilder.CreateSphere('jcanS',{diameter:0.72,segments:6},scene); m.material=stdMat('jcanM',featC); return m; }, 25);
        for (let i=0;i<8;i++){ const x=rndX(), z=rndZ(); placeDeco('vine', () => { const m=B.MeshBuilder.CreateCylinder('vineS',{height:1.4,diameter:0.06,tessellation:5},scene); m.material=stdMat('vineM',hexC3('#2f5a30')); return m; }, x, yAt(x,z)+0.9, z); }
        break;
      case 'mountain':
        for (let i=0;i<14;i++){ const x=rndX(), z=rndZ(); placeDeco('rock', rockB('#6b6b6b'), x, yAt(x,z)+0.2, z, { shadow:true, rot:new B.Vector3(Math.random(),Math.random(),Math.random()), scale:jit() }); }
        break;
      case 'desert':
        for (let i=0;i<3;i++){ const x=rndX(), z=rndZ(); placeDeco('rock', rockB('#a8893f'), x, yAt(x,z)+0.2, z, { rot:new B.Vector3(Math.random(),Math.random(),0) }); }
        break;
      case 'tundra':
        for (let i=0;i<10;i++){ const x=rndX(), z=rndZ(); placeDeco('spike', () => { const m=B.MeshBuilder.CreateCylinder('spikeS',{height:0.5,diameterTop:0,diameterBottom:0.2,tessellation:6},scene); m.material=stdMat('spikeM',hexC3('#cfe2ee')); return m; }, x, yAt(x,z)+0.25, z); }
        for (let i=0;i<6;i++){ const x=rndX(), z=rndZ(); placeDeco('crack', () => { const m=B.MeshBuilder.CreateBox('crackS',{width:1.2,height:0.02,depth:0.08},scene); m.material=stdMat('crackM',hexC3('#5a6b78')); return m; }, x, yAt(x,z)+0.02, z, { rot:new B.Vector3(0,Math.random()*3,0) }); }
        break;
      case 'plains':
        for (let i=0;i<16;i++){ const x=rndX(), z=rndZ(); placeDeco('grass', grassB(pal.feature), x, yAt(x,z)+0.15, z); }
        break;
      case 'savanna':
        for (let i=0;i<8;i++){ const x=rndX(), z=rndZ(), ty=yAt(x,z);
          placeDeco('atrunk', () => { const m=B.MeshBuilder.CreateCylinder('atrunkS',{height:1.0,diameter:0.16,tessellation:6},scene); m.material=stdMat('atrunkM',hexC3('#7a5a32')); return m; }, x, ty+0.5, z, { shadow:true });
          placeDeco('adisc',  () => { const m=B.MeshBuilder.CreateCylinder('adiscS',{height:0.1,diameter:1.3,tessellation:10},scene); m.material=stdMat('adiscM',hexC3('#7a8a4a')); return m; }, x, ty+1.05, z); }
        for (let i=0;i<8;i++){ const x=rndX(), z=rndZ(); placeDeco('grass', grassB('#b0a060'), x, yAt(x,z)+0.15, z); }
        break;
      case 'volcanic':
        for (let i=0;i<8;i++){ const x=rndX(), z=rndZ(); placeDeco('lava', () => { const m=B.MeshBuilder.CreateBox('lavaS',{width:1.4,height:0.03,depth:0.12},scene); m.material=stdMat('lavaM',hexC3('#ff5a1a'),{ emissive:hexC3('#ff5a1a'), disableLighting:true }); return m; }, x, yAt(x,z)+0.03, z, { rot:new B.Vector3(0,Math.random()*3,0) }); }
        for (let i=0;i<3;i++){ const x=xc+(Math.random()*2-1)*7, z=(Math.random()*2-1)*7; terrain.ps.push(makeFlame(new B.Vector3(x,0.2,z))); }
        break;
      case 'swamp':
        for (let i=0;i<5;i++){ const x=rndX(), z=rndZ(); makeWater(new B.Vector3(x,0.04,z), 2.4, '#3a6a5a'); }
        for (let i=0;i<8;i++){ const x=rndX(), z=rndZ(); placeDeco('svine', () => { const m=B.MeshBuilder.CreateCylinder('svineS',{height:1.6,diameter:0.05,tessellation:5},scene); m.material=stdMat('svineM',hexC3('#3a5030')); return m; }, x, 1.2, z); }
        break;
      case 'coastal':
        makeWater(new B.Vector3(xc + side*7, 0.02, 0), 6, '#2a6a9a');     // outer-edge sea
        for (let i=0;i<10;i++){ const x=xc - side*Math.random()*6, z=rndZ(); placeDeco('grass', grassB('#9aa86a'), x, yAt(x,z)+0.15, z); }
        break;
      default:
        for (let i=0;i<5;i++){ const x=rndX(), z=rndZ(); placeDeco('rock', rockB(pal.feature), x, yAt(x,z)+0.2, z, { rot:new B.Vector3(Math.random(),Math.random(),0) }); }
    }
  }

  function updateTerrainAnim(dt) {
    if (!terrain) return;
    terrain.t += dt;
    for (const a of terrain.anims) {
      if      (a.type === 'shimmer') { a.tex.uOffset += dt*0.03; a.tex.vOffset += dt*0.012; }
      else if (a.type === 'water')   { a.mesh.position.y = a.baseY + Math.sin(terrain.t*1.6 + a.ph)*0.03; }
    }
  }

  function disposeTerrain() {
    if (!terrain) return;
    for (const ps of terrain.ps)   { try { ps.dispose(); } catch (e) {} }
    for (const d of terrain.deco)  d.dispose();
    for (const s of terrain.decoSrc) s.dispose();
    for (const g of terrain.grounds) { if (g.material && g.material.diffuseTexture) g.material.diffuseTexture.dispose(); g.dispose(); }
    for (const m of terrain.mats)  { try { m.dispose(); } catch (e) {} }
    terrain = null;
  }

  /* ========================================================================
   *  ASSET LOADERS  (Mixamo soldier · Kenney building)
   *  Both use the SAME ImportMeshAsync pattern and BOTH fall back to a
   *  primitive so the scene always renders even with no /assets present.
   * ====================================================================== */

  /*
   * SOLDIER — Mixamo GLB workflow  (drop the result at  ./assets/soldier.glb )
   * -------------------------------------------------------------------------
   *  1. mixamo.com → pick a character (e.g. "Erika"/"Knight") → it loads in a
   *     default A-POSE.  Leave it A-pose; do NOT force T-pose — Mixamo rigs and
   *     retargets from A-pose and the GLB skinning bakes fine either way.
   *  2. Grab the clips you'll want per battle phase and download each as FBX:
   *        • "Idle"                     → spawn phase
   *        • "Walking" / "Run" (IN PLACE)→ march phase   ← tick "In Place" so the
   *          root doesn't translate; WE move the mesh (Vector3.Lerp), not the clip
   *        • "Sword And Shield Slash" / "Great Sword Slash" → clash phase
   *        • "Dying" / "Falling Back Death" → death on attrition
   *     FBX export settings:  Format = FBX Binary,  Skin = "With Skin" for the
   *     first/base download and "Without Skin" for the extra animation-only
   *     clips,  FPS = 30,  No Keyframe Reduction (smoother), Pose = T-pose is
   *     NOT required — keep the default.
   *  3. Convert FBX → GLB (pick one):
   *        • Blender: Import FBX → set unit scale, Apply All Transforms →
   *          Export glTF 2.0 (.glb), +Y up, "Bake Animation" + "Skinning" ON,
   *          merge all the FBX clips into ONE .glb so they arrive as separate
   *          AnimationGroups we can switch between.
   *        • FBX2glTF (github.com/facebookincubator/FBX2glTF):  FBX2glTF -b -o soldier soldier.fbx
   *        • Babylon Sandbox (sandbox.babylonjs.com) → drag FBX in → export GLB.
   *  4. SCALE: Mixamo is centimetres (≈100× too big in metres). Either fix the
   *     scale in Blender before export, or scale the root by 0.01 on import
   *     (see the heuristic below).  Target height ≈ 1.6 units to match our ground.
   */
  async function loadSoldier() {
    try {
      // AEON_DATA_HOOK: placeholder path './assets/soldier.glb'
      const r = await B.SceneLoader.ImportMeshAsync('', './assets/', 'soldier.glb', scene);
      const root = r.meshes[0];                 // glTF "__root__" transform node
      root.name = 'soldierGLBRoot';
      // Auto-downscale a centimetre-scale Mixamo export to ~1.6 units tall.
      const bb = root.getHierarchyBoundingVectors();
      const h = bb.max.y - bb.min.y;
      if (h > 8) root.scaling.scaleInPlace(1.6 / h);
      root.setEnabled(false);                   // hidden template; we clone per unit

      // Requirement #3: play the first AnimationGroup (idle/walk) from the GLB.
      if (r.animationGroups && r.animationGroups.length) {
        r.animationGroups.forEach(g => g.stop());
        r.animationGroups[0].start(true);       // loop the first clip on the template
      }
      log('Loaded soldier.glb (' + (r.animationGroups||[]).length + ' anim groups).');
      return { isPlaceholder:false, glbRoot:root, animationGroups:r.animationGroups || [] };
    } catch (e) {
      // Requirement #3 fallback: capsule so the scene still renders with no GLB.
      console.info('[battle3d] ./assets/soldier.glb not found → capsule placeholders.', e.message);
      return { isPlaceholder:true };
    }
  }

  /*
   * BUILDING — Kenney asset workflow  ( ./assets/building.glb )
   * -------------------------------------------------------------------------
   *  Kenney packs are CC0 (public domain — no attribution required). Good fits:
   *        • "Tower Defense Kit"  — towers/keeps, reads great top-down
   *        • "Castle Kit"         — walls, keeps, gatehouses (fortress vibe)
   *        • "City Kit (Commercial)" / "Medieval Town" — civilian settlements
   *     Download from kenney.nl/assets.  They ship as OBJ + GLTF + FBX.
   *  Export workflow:
   *        • If a .gltf/.glb is already in the pack, just rename/copy a building
   *          to ./assets/building.glb and you're done.
   *        • Otherwise import the OBJ into Blender, set materials, and Export
   *          glTF 2.0 (.glb).  Combine a few props (keep + wall + flag) into one
   *          building.glb if you want a richer settlement silhouette.
   *  In the integrated build you'd pick the mesh per civ.focus/tier and tint it
   *  to civ.color (vertex paint, a team-colour material slot, or a decal).
   */
  async function loadBuilding() {
    try {
      const r = await B.SceneLoader.ImportMeshAsync('', './assets/', 'building.glb', scene);
      const root = r.meshes[0];
      root.name = 'buildingGLBRoot';
      const bb = root.getHierarchyBoundingVectors();
      const h = bb.max.y - bb.min.y;
      if (h > 8) root.scaling.scaleInPlace(2.4 / h);
      root.setEnabled(false);
      log('Loaded building.glb.');
      return { isPlaceholder:false, glbRoot:root };
    } catch (e) {
      // Requirement #4 fallback: a coloured box per building.
      console.info('[battle3d] ./assets/building.glb not found → box placeholders.', e.message);
      return { isPlaceholder:true };
    }
  }

  /* ========================================================================
   *  BATTLE3D — phase state machine mirroring BattleVisualizer (js/battle.js)
   *      spawn → march → clash → resolve → done
   * ====================================================================== */
  class Battle3D {
    constructor(outcome) {
      this.outcome  = outcome;
      this.invader  = outcome.invader;
      this.defender = outcome.defender;
      this.winner   = outcome.winner;
      this.loser    = outcome.loser;
      this.bySide   = { [this.invader.side]:this.invader, [this.defender.side]:this.defender };

      this.units = [];
      this.buildings = [];
      this.settlements = [];         // UPGRADE 2: tech-age building records
      this.startCount = {};          // side → spawned unit count (for army scaling)
      this.specialFired = {};        // side → bool
      this.phase = 'spawn';
      this.phaseTime = 0;            // seconds in current phase
      this.t = 0;                    // total seconds (bob clock)
      this.killAcc = 0;
      this.battleLog = [];           // {year,text} — consumed by finishGame() upstream
      this._id = 0;
      this._glbShadowCasters = 0;
      this._endYear = 1000;          // AEON_DATA_HOOK: Game.maxYear / map.endYear
      this._done = false;
      this._activeParticles = [];
    }

    start() {
      // AEON_DATA_HOOK (1v1v1): if (outcome.threeWay) iterate outcome.entries
      //   (each {civ, casualtyPct, fellAt}) and spawn three armies into three
      //   sectors instead of two facing rows. Same phase machine otherwise.

      // UPGRADE 1: per-side race templates (built once, instanced per soldier).
      this.MAX_POINT_LIGHTS = 2; this.MAX_SPARKLES = 4;
      this._pointLights = 0; this._sparkles = 0;
      this.templates = {
        [this.invader.side]:  buildRaceTemplate(this.invader),
        [this.defender.side]: buildRaceTemplate(this.defender),
      };

      this.groundY = 0;     // procedural humanoids are built feet-at-origin

      this.spawnSide(this.invader, -1);   // A on the left  (marches +x toward the border)
      this.spawnSide(this.defender, +1);  // B on the right (marches -x toward the border)
      this.spawnSettlements(this.invader, -1);   // UPGRADE 2: tech-age buildings
      this.spawnSettlements(this.defender, +1);

      // attrition targets derived from the resolver's casualty fractions
      const sW = this.startCount[this.winner.side];
      const sL = this.startCount[this.loser.side];
      // AEON_DATA_HOOK: winner survivors = army × (1 − winnerCasualtyPct)
      this.winnerSurvivors = Math.max(1, Math.round(sW * (1 - this.outcome.winnerCasualtyPct)));
      this.loserFloor      = Math.max(1, Math.round(sL * 0.12));   // clash ends here → resolve
      this.winnerKillChance = clamp(this.outcome.winnerCasualtyPct * 0.85, 0.05, 0.85);

      this.log(`${this.invader.name} fields ${formatNum(this.invader.army)} soldiers.`);
      this.log(`${this.defender.name} fields ${formatNum(this.defender.army)} soldiers.`);
      this.log(`${this.invader.name} marches to attack.`);
      this.updateUI();
    }

    /* ----- spawning -------------------------------------------------------- */
    spawnSide(civ, dir) {
      const n = armyToUnits(civ.army);          // AEON_DATA_HOOK: army → instances
      this.startCount[civ.side] = n;
      const cols = 6, spacing = 1.05;
      const rows = Math.ceil(n / cols);
      let k = 0;
      for (let r = 0; r < rows && k < n; r++) {
        for (let c = 0; c < cols && k < n; c++) {
          const z = (c - (cols-1)/2) * spacing * 1.15;
          const x = dir * (7 - r * spacing);
          const type = pickType(civ.focus, k);  // AEON_DATA_HOOK: focus → unit type
          const u = this.spawnOne(civ, new B.Vector3(x, this.groundY, z), type);
          u.home = u.mesh.position.clone();
          u.marchTarget = new B.Vector3(dir * (0.8 + r*0.10), u.baseY, z + (Math.random()-0.5)*0.3);
          this.units.push(u);
          k++;
        }
      }
    }

    spawnOne(civ, pos, type) {
      const tmpl = this.templates[civ.side];
      const node = new B.TransformNode('sol' + (this._id++), scene);
      node.position.copyFrom(pos);

      let profile, parts = [], orb = null, light = null, sparkle = null, topY = 1.4;

      if (tmpl.type === 'glb') {
        // GLB path: clone the imported hierarchy under the node (kept from Phase 1).
        const c = soldierTmpl.glbRoot.clone('g' + this._id);
        c.setEnabled(true); c.parent = node;
        parts.push(c);                          // tracked for disposal
        // AEON_DATA_HOOK: tint this clone to civ.color (team material slot / decal).
        if (this._glbShadowCasters < 80) { shadowGen.addShadowCaster(c); this._glbShadowCasters++; }
        profile = getRaceProfile(civ.race);
      } else {
        // PROCEDURAL: one InstancedMesh per body part, parented to the node, so a
        // soldier is a TransformNode of instances — cheap and race-shaped.
        profile = tmpl.profile; topY = tmpl.topY;
        for (const d of tmpl.partDefs) {
          const inst = d.src.createInstance('p' + this._id + '_' + parts.length);
          inst.parent = node;
          inst.position.set(d.pos[0], d.pos[1], d.pos[2]);
          inst.scaling.set(d.scale[0], d.scale[1], d.scale[2]);
          inst.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
          parts.push(inst);
        }
      }

      // race overall × focus-type scale on the PARENT (scales the whole soldier)
      const sc = profile.overallScale * applyTypeScale(type);   // AEON_DATA_HOOK: focus → type
      node.scaling.setAll(sc);
      if (profile.bodyTilt) node.rotation.x = profile.bodyTilt;

      const baseY = pos.y + (profile.hoverY || 0);
      node.position.y = baseY;

      // Mages keep their glowing orb (a focus-type flourish).
      if (type === 'mage') {
        orb = mageOrbSrc.createInstance('orb' + this._id);
        orb.parent = node; orb.position.y = topY + 0.2;
      }
      // Infernals get a real dim point light — but CAPPED (lights are costly per
      // material), so only the first few do; the rest rely on emissive fire glow.
      if (profile.pointLight && this._pointLights < this.MAX_POINT_LIGHTS) {
        light = new B.PointLight('ifl' + this._id, new B.Vector3(0, topY*0.6, 0), scene);
        light.parent = node; light.diffuse = hexC3(civ.color); light.specular = hexC3(civ.color);
        light.intensity = 0.45; light.range = 4.5;
        this._pointLights++;
      }
      // Fae get a sparkle particle trail — also CAPPED for the same reason.
      if (profile.sparkle && this._sparkles < this.MAX_SPARKLES) {
        sparkle = makeSparkle(node, civ.color); this._sparkles++;
      }

      return { mesh:node, parts, orb, light, sparkle,
               baseScale:new B.Vector3(sc, sc, sc), baseY, side:civ.side, civ, type,
               alive:true, dying:false, dead:false, deathT:0,
               bob:Math.random()*6.28, bobStyle:profile.bob, scatter:null };
    }

    // UPGRADE 2: place several tech-age settlements around the spawn zone and
    // record each so step() can rebuild it when civ.techAge changes.
    spawnSettlements(civ, dir) {
      const N = 4;
      const industry = civ.focus === 'industry';        // AEON_DATA_HOOK: civ.focus (industry bonus)
      for (let i = 0; i < N; i++) {
        const pos = new B.Vector3(dir * (9 + (i % 2) * 1.6), 0, (i - (N-1)/2) * 2.7);
        const age = civ.techAge | 0;                     // AEON_DATA_HOOK: civ.techAge
        const node = buildSettlement(age, civ.color, scene, industry);   // AEON_DATA_HOOK: civ.color
        node.position.copyFrom(pos);
        this.settlements.push({ civ, node, lastAge:age, pos, industry });
      }
    }

    // Watch each settlement's civ.techAge; on change, rebuild + construction burst.
    stepSettlements(dt) {
      for (const rec of this.settlements) {
        const age = rec.civ.techAge | 0;                 // AEON_DATA_HOOK: civ.techAge
        if (age !== rec.lastAge) {
          const at = rec.node.position.clone(); at.y += 1;
          disposeSettlement(rec);
          rec.node = buildSettlement(age, rec.civ.color, scene, rec.industry);
          rec.node.position.copyFrom(rec.pos);
          rec.lastAge = age;
          this.constructionBurst(at, rec.civ.color);
        }
        updateSettlementAnim(rec.node, dt);
      }
    }

    constructionBurst(at, hex) {
      const ps = new B.ParticleSystem('build', 160, scene);
      ps.particleTexture = particleTex;
      ps.emitter = at;
      ps.minEmitBox = new B.Vector3(-0.8, 0, -0.8); ps.maxEmitBox = new B.Vector3(0.8, 0.4, 0.8);
      ps.color1 = col4('#b9a07a', 0.9); ps.color2 = col4(hex, 0.8); ps.colorDead = col4('#b9a07a', 0);
      ps.minSize = 0.15; ps.maxSize = 0.5; ps.minLifeTime = 0.4; ps.maxLifeTime = 1.0;
      ps.minEmitPower = 1.5; ps.maxEmitPower = 4; ps.gravity = new B.Vector3(0, -2, 0);
      ps.emitRate = 0; ps.manualEmitCount = 160; ps.disposeOnStop = true;
      ps.start(); setTimeout(() => ps.stop(), 60); this._activeParticles.push(ps);
    }

    /* ----- per-frame step (driven by the render loop) ---------------------- */
    step(dt) {
      if (this._done) return;
      dt = Math.min(dt, 0.05);            // clamp huge frame gaps (tab refocus)
      this.t += dt; this.phaseTime += dt;

      if      (this.phase === 'spawn')   this.stepSpawn();
      else if (this.phase === 'march')   this.stepMarch(dt);
      else if (this.phase === 'clash')   this.stepClash(dt);
      else if (this.phase === 'resolve') this.stepResolve(dt);

      this.processDying(dt);
      this.stepSettlements(dt);     // UPGRADE 2: rebuild buildings on tech-age change
      this.updateUI();
    }

    // UPGRADE 1: per-race bob/shake on the parent node (constructs stay rigid).
    bobUnit(u, ampMul, jitter) {
      if (u.bobStyle === 'none') { u.mesh.position.y = u.baseY; return; }
      let amp = 0.06 * ampMul, fr = 6;
      switch (u.bobStyle) {
        case 'erratic': amp *= 1.7; fr = 9;  break;   // goblins
        case 'skitter': amp *= 0.6; fr = 16; break;   // insectoids
        case 'prowl':   amp *= 0.8; fr = 4;  break;   // beastfolk
        case 'slither': amp *= 0.5; fr = 7;  break;   // merfolk
      }
      u.mesh.position.y = u.baseY + Math.sin(this.t * fr + u.bob) * amp;
      if (jitter) {
        u.mesh.position.x += (Math.random() - 0.5) * jitter;
        u.mesh.position.z += (Math.random() - 0.5) * jitter;
      }
    }

    stepSpawn() {
      // brief muster, idle in place, then advance
      if (this.phaseTime > 0.8) { this.phase = 'march'; this.phaseTime = 0; }
    }

    stepMarch(dt) {
      // fire specials shortly after the advance begins (mirrors stepMarch timing)
      for (const civ of [this.invader, this.defender]) {
        // AEON_DATA_HOOK: civ.weaponUnlocked gates the special cinematic
        if (civ.weaponUnlocked && !this.specialFired[civ.side] && this.phaseTime > 1.0) {
          this.specialFired[civ.side] = true;
          this.fireSpecial(civ);
        }
      }
      let arrived = 0, alive = 0;
      for (const u of this.units) {
        if (!u.alive || u.dying) continue;
        alive++;
        B.Vector3.LerpToRef(u.mesh.position, u.marchTarget, clamp(dt*1.8, 0, 1), u.mesh.position);
        this.bobUnit(u, 1.3, 0);                                               // march bob (raised)
        if (B.Vector3.Distance(u.mesh.position, u.marchTarget) < 0.45) arrived++;
      }
      if (this.phaseTime > 5 || (alive > 0 && arrived / alive > 0.7)) {
        this.phase = 'clash'; this.phaseTime = 0;
        this.log('The armies clash!');
      }
    }

    stepClash(dt) {
      // tight melee jitter
      for (const u of this.units) {
        if (!u.alive || u.dying) continue;
        const push = (u.side === this.invader.side) ? 1 : -1;
        u.mesh.position.x += Math.sin(this.t*10 + u.bob) * 0.004 * push;
        this.bobUnit(u, 0.8, 0.012);                                          // clash shake
      }
      // attrition paced by a fixed tick; rates derived from casualty fractions
      this.killAcc += dt;
      const TICK = 0.05;
      while (this.killAcc >= TICK) {
        this.killAcc -= TICK;
        if (this.aliveOf(this.loser) > this.loserFloor) this.killRandom(this.loser);
        if (this.aliveOf(this.winner) > this.winnerSurvivors && Math.random() < this.winnerKillChance)
          this.killRandom(this.winner);
      }
      if (this.aliveOf(this.loser) <= this.loserFloor || this.phaseTime > 7) {
        this.phase = 'resolve'; this.phaseTime = 0;
        this.log(`${this.winner.name} ${this.outcome.threeWay ? 'stands triumphant' : 'routs the enemy'}!`);
        // the rout: every surviving loser falls
        for (const u of this.units) if (u.civ === this.loser && u.alive) this.kill(u);
      }
    }

    stepResolve(dt) {
      camera.alpha += 0.002;        // UPGRADE 3: slow cinematic auto-orbit on resolve
      // winner fans out to occupy the whole field
      for (const u of this.units) {
        if (u.civ !== this.winner || !u.alive || u.dying) continue;
        if (!u.scatter) u.scatter = new B.Vector3((Math.random()*2-1)*16, u.baseY, (Math.random()*2-1)*9);
        B.Vector3.LerpToRef(u.mesh.position, u.scatter, clamp(dt*0.8, 0, 1), u.mesh.position);
        this.bobUnit(u, 0.9, 0);
      }
      if (this.phaseTime > 3.2) { this.phase = 'done'; this._done = true; }
    }

    /* ----- attrition helpers ---------------------------------------------- */
    aliveOf(civ) { let n = 0; for (const u of this.units) if (u.civ === civ && u.alive) n++; return n; }
    killRandom(civ) {
      const pool = this.units.filter(u => u.civ === civ && u.alive && !u.dying);
      if (pool.length) this.kill(pool[(Math.random()*pool.length)|0]);
    }
    kill(u) { if (u.alive) { u.alive = false; u.dying = true; u.deathT = 0; } }

    processDying(dt) {
      for (const u of this.units) {
        if (!u.dying || u.dead) continue;
        u.deathT += dt;
        const k = Math.max(0, 1 - u.deathT / 0.45);
        u.mesh.scaling.set(u.baseScale.x*k, u.baseScale.y*k, u.baseScale.z*k);
        u.mesh.position.y = u.baseY - (1 - k) * 0.5;          // sink into the ground
        if (k <= 0) {
          u.dead = true;
          u.mesh.setEnabled(false);
          if (u.orb) u.orb.setEnabled(false);
          if (u.light) u.light.setEnabled(false);
          if (u.sparkle) u.sparkle.stop();
        }
      }
    }

    /* ----- special weapon cinematic --------------------------------------- *
     * Requirement #7 — ParticleSystem ring expanding white → civ → gold → red,
     * matching fireSpecial() in battle.js (which also flashes the screen and
     * kills ~16% of the enemy at the blast).
     * -------------------------------------------------------------------- */
    fireSpecial(civ) {
      // AEON_DATA_HOOK: civ.weapon name for the log line
      this.log(`${civ.name} unleashes ${civ.weapon}!`);

      const at = new B.Vector3(0, 0.9, 0);    // clash point
      flashScreen(0.7);                        // mirrors renderer.flashEffect = 0.65

      const ps = new B.ParticleSystem('special_' + civ.side, 800, scene);
      ps.particleTexture = particleTex;
      ps.emitter = at.clone();
      ps.minEmitBox = B.Vector3.Zero();
      ps.maxEmitBox = B.Vector3.Zero();
      ps.blendMode = B.ParticleSystem.BLENDMODE_ADD;
      // radial burst, mostly in the ground plane → an expanding RING
      ps.startDirectionFunction = (wm, dir) => {
        const a = Math.random() * Math.PI * 2;
        dir.x = Math.cos(a); dir.y = Math.random() * 0.5; dir.z = Math.sin(a);
      };
      ps.minLifeTime = 0.5;  ps.maxLifeTime = 1.1;
      ps.minSize = 0.25;     ps.maxSize = 0.95;
      ps.minEmitPower = 6;   ps.maxEmitPower = 15;  ps.updateSpeed = 0.02;
      ps.gravity = new B.Vector3(0, -3, 0);
      // AEON_DATA_HOOK: ring colour ramp == fireSpecial()'s
      //   ['#ffffff', civ.color, '#ffe14d', '#c04040']
      ps.addColorGradient(0.00, col4('#ffffff', 1));
      ps.addColorGradient(0.33, col4(civ.color, 1));
      ps.addColorGradient(0.66, col4('#ffe14d', 1));
      ps.addColorGradient(0.90, col4('#c04040', 1));
      ps.addColorGradient(1.00, col4('#c04040', 0));
      ps.emitRate = 0;
      ps.manualEmitCount = 800;     // one-shot burst
      ps.disposeOnStop = true;
      ps.start();
      setTimeout(() => ps.stop(), 60);
      this._activeParticles.push(ps);

      // AEON_DATA_HOOK: kill ~16% of the enemy near the blast (== fireSpecial())
      const enemies = this.units.filter(u => u.side !== civ.side && u.alive && !u.dying);
      const killCount = Math.floor(enemies.length * 0.16);
      for (let i = 0; i < killCount; i++) {
        const v = enemies[(Math.random()*enemies.length)|0];
        if (v && v.alive) this.kill(v);
      }
    }

    /* ----- UI + log -------------------------------------------------------- */
    updateUI() {
      for (const side of ['A','B']) {
        const civ = this.bySide[side]; if (!civ) continue;
        const start = this.startCount[side] || 1;
        const liveArmy = Math.round(civ.army * this.aliveOf(civ) / start);   // AEON_DATA_HOOK
        $(side + '-name').textContent = civ.name;
        $(side + '-name').style.color = civ.color;
        $(side + '-sub').textContent  = (civ.race || '') + ' · ' + (civ.focus || '');
        $(side + '-army').textContent = formatNum(liveArmy);
        $(side + '-weapon').textContent =
          civ.weaponUnlocked ? ('⚡ ' + (civ.weapon || 'Special')) : '';
      }
      $('phase').textContent = this.phase;
      $('yr').textContent = 'FINAL BATTLE · Y' + this._endYear;
    }

    log(text) {
      this.battleLog.push({ year:this._endYear, text });
      renderLog(this.battleLog);
    }

    /* ----- teardown (for replay / integration handoff) -------------------- */
    dispose() {
      for (const u of this.units) {
        for (const p of u.parts) p.dispose();
        if (u.orb) u.orb.dispose();
        if (u.light) u.light.dispose();
        if (u.sparkle) u.sparkle.dispose();
        u.mesh.dispose();
      }
      for (const t of Object.values(this.templates || {})) {
        if (t.owned) for (const m of t.owned) m.dispose();
        if (t.mats)  for (const m of t.mats)  m.dispose();
      }
      for (const rec of (this.settlements || [])) disposeSettlement(rec);
      for (const b of this.buildings) b.dispose();
      for (const ps of this._activeParticles) { try { ps.dispose(); } catch (e) {} }
      this.units.length = 0; this.buildings.length = 0;
      if (this.settlements) this.settlements.length = 0;
    }

    isDone() { return this.phase === 'done'; }
  }

  /* ========================================================================
   *  UNIT-SOURCE + TYPE HELPERS
   * ====================================================================== */

  /* ========================================================================
   *  UPGRADE 1 — RACE-DIFFERENTIATED PROCEDURAL SOLDIERS
   *  ------------------------------------------------------------------------
   *  Each soldier is a TransformNode parent whose children are InstancedMesh
   *  body parts (body/head/arms/legs + race extras). The PART SOURCES are built
   *  once per side as a "template" (buildRaceTemplate) — never shown directly —
   *  and every soldier is assembled from createInstance() calls, so 200+ troops
   *  stay cheap (a handful of instanced sources + flat shadow-caster count).
   * ====================================================================== */

  // colour helpers
  const mix  = (a, b, t) => new B.Color3(a.r+(b.r-a.r)*t, a.g+(b.g-a.g)*t, a.b+(b.b-a.b)*t);
  const desat= (c)       => { const l=(c.r+c.g+c.b)/3; return new B.Color3(l*0.6+c.r*0.4, l*0.6+c.g*0.4, l*0.6+c.b*0.4); };
  const clampC=(c)       => new B.Color3(clamp(c.r,0,1), clamp(c.g,0,1), clamp(c.b,0,1));

  function stdMat(name, color, opts) {
    const m = new B.StandardMaterial(name, scene);
    m.diffuseColor = clampC(color);
    m.specularColor = new B.Color3(0.08, 0.08, 0.08);
    m.maxSimultaneousLights = 8;                 // headroom for infernal point lights
    if (opts) {
      if (opts.emissive)        m.emissiveColor = clampC(opts.emissive);
      if (opts.disableLighting) m.disableLighting = true;
      if (opts.metallic) { m.specularColor = new B.Color3(0.55,0.55,0.6); m.specularPower = 64; }
    }
    return m;
  }

  // AEON_DATA_HOOK: civ.race → visual profile. Unlisted races fall back to humans.
  const RACE_DEFAULTS = {
    overallScale:1, bodyShape:'cylinder', headShape:'sphere',
    bodyScaleX:1, bodyScaleY:1, headScale:1, bodyTilt:0, hoverY:0, bob:'normal',
    emissive:0, metallic:false, bodyTint:null, headTint:null, limbTint:null,
    extras:{}, pointLight:false, sparkle:false,
  };
  const RACE_OVERRIDES = {
    humans:   {},
    orcs:     { bodyScaleX:1.4, bodyScaleY:0.85, headScale:1.2,
                bodyTint:()=>hexC3('#3a5a3a'), headTint:()=>hexC3('#3a5a3a'), limbTint:()=>hexC3('#2f4a2f'),
                extras:{ shoulderPads:true, thickArms:true } },
    elves:    { bodyScaleX:0.75, bodyScaleY:1.25, headScale:0.8, emissive:0.22, extras:{ robe:true } },
    dwarves:  { bodyScaleX:1.5, bodyScaleY:0.65, limbTint:c=>c.scale(0.55),
                extras:{ armor:true, helmet:true } },
    frostborn:{ bodyScaleX:1.2, bodyScaleY:0.9, bodyTint:c=>mix(c, hexC3('#dfeefc'), 0.45),
                extras:{ furCollar:true } },
    giants:   { overallScale:2, headScale:1.3, bodyTint:()=>hexC3('#6b6b6b'),
                headTint:()=>hexC3('#6b6b6b'), limbTint:()=>hexC3('#565656'), extras:{ belt:true } },
    goblins:  { overallScale:0.6, bodyTilt:0.26, headScale:1.4, bob:'erratic',
                limbTint:()=>hexC3('#23252b') },
    undead:   { bodyScaleX:0.8, bodyTilt:0.12, headShape:'flatsphere', bodyTint:c=>desat(c),
                headTint:()=>hexC3('#cfcabb'), limbTint:()=>hexC3('#9a958a'), extras:{ eyes:true } },
    infernals:{ bodyScaleX:1.1, bodyScaleY:1.2, emissive:0.5, bodyTint:c=>mix(hexC3('#1a0e0e'), c, 0.4),
                extras:{ horns:true }, pointLight:true },
    lizardfolk:{ headScale:1.05, bodyTint:c=>mix(c, hexC3('#2f6a3a'), 0.4), extras:{ tail:true } },
    avians:   { bodyScaleX:0.85, bodyScaleY:1.1, headScale:0.85,
                bodyTint:c=>mix(c, hexC3('#dfe6ee'), 0.2), extras:{ wings:true } },
    fae:      { overallScale:0.9, bodyScaleX:0.65, hoverY:0.3, headScale:0.8, emissive:0.6, sparkle:true },
    merfolk:  { bodyTint:c=>mix(c, hexC3('#3a7ad0'), 0.4), bob:'slither', extras:{ fin:true } },
    constructs:{ bodyShape:'box', headShape:'box', metallic:true, bob:'none',
                bodyTint:()=>hexC3('#6a6e76'), headTint:()=>hexC3('#5a5e66'), extras:{ leds:true } },
    beastfolk:{ bodyTilt:0.35, bob:'prowl', bodyTint:c=>mix(hexC3('#6b4a2f'), c, 0.35),
                extras:{ longArms:true } },
    insectoids:{ bodyScaleX:0.8, headShape:'icosphere', bob:'skitter',
                bodyTint:c=>mix(hexC3('#1a1a22'), c, 0.4), extras:{ fourArms:true } },
  };
  function getRaceProfile(race) {
    const o = RACE_OVERRIDES[race] || {};
    return Object.assign({}, RACE_DEFAULTS, o, { extras: Object.assign({}, o.extras || {}) });
  }

  // Build the per-side part-source set + the part-instance layout (partDefs).
  function buildRaceTemplate(civ) {
    if (soldierTmpl && !soldierTmpl.isPlaceholder) return { type:'glb' };   // real GLB → clone path

    const p = getRaceProfile(civ.race);                 // AEON_DATA_HOOK: civ.race
    const civC = hexC3(civ.color);                      // AEON_DATA_HOOK: civ.color
    const S = civ.side;
    const bodyCol = p.bodyTint ? p.bodyTint(civC) : civC.clone();
    const headCol = p.headTint ? p.headTint(civC) : civC.scale(1.15);
    const limbCol = p.limbTint ? p.limbTint(civC) : civC.scale(0.7);

    const matBody = stdMat('body_'+S, bodyCol, { emissive: p.emissive?bodyCol.scale(p.emissive):null, metallic:p.metallic });
    const matHead = stdMat('head_'+S, headCol, { emissive: p.emissive?headCol.scale(p.emissive*0.6):null, metallic:p.metallic });
    const matLimb = stdMat('limb_'+S, limbCol, { metallic:p.metallic });

    const owned = [];        // every source mesh we make, for disposal
    const ownedMats = [];    // …and every material (incl. race extras)
    function src(mesh, mat, castShadow) {
      mesh.material = mat; mesh.isVisible = false; mesh.isPickable = false; mesh.position.y = -50;
      owned.push(mesh);
      if (mat && ownedMats.indexOf(mat) < 0) ownedMats.push(mat);
      if (castShadow) shadowGen.addShadowCaster(mesh);
      return mesh;
    }

    // core sources
    const bodySrc = src(p.bodyShape === 'box'
      ? B.MeshBuilder.CreateBox('b_'+S, { width:0.5, height:0.9, depth:0.36 }, scene)
      : B.MeshBuilder.CreateCylinder('b_'+S, { height:0.9, diameterTop:0.42, diameterBottom:0.5, tessellation:10 }, scene),
      matBody, true);
    let headSrc;
    if (p.headShape === 'box')        headSrc = B.MeshBuilder.CreateBox('h_'+S, { size:0.42 }, scene);
    else if (p.headShape === 'icosphere') headSrc = B.MeshBuilder.CreateIcoSphere('h_'+S, { radius:0.25, subdivisions:1 }, scene);
    else                              headSrc = B.MeshBuilder.CreateSphere('h_'+S, { diameter:0.5, segments:10 }, scene);
    src(headSrc, matHead, true);
    const limbSrc = src(B.MeshBuilder.CreateCylinder('l_'+S, { height:0.5, diameter:0.16, tessellation:6 }, scene), matLimb, true);

    // layout (feet at local y=0)
    const legH = 0.5, bsx = p.bodyScaleX, bsy = p.bodyScaleY;
    const bodyH = 0.9 * bsy, bodyY = legH + bodyH/2, bodyR = 0.25 * bsx;
    const headR = 0.25 * p.headScale;
    const headY = legH + bodyH + headR * 0.9;
    const shoulderY = legH + bodyH * 0.78;
    const armX = bodyR + 0.05, armThick = p.extras.thickArms ? 1.6 : 1, armLen = (p.extras.longArms ? 0.62 : 0.46);
    const topY = headY + headR;

    const defs = [];
    const def = (s, pos, scl, rot) => defs.push({ src:s, pos, scale:scl||[1,1,1], rot:rot||[0,0,0] });

    def(bodySrc, [0, bodyY, 0], [bsx, bsy, bsx]);
    def(headSrc, [0, headY, 0], [p.headScale, p.headScale*(p.headShape==='flatsphere'?0.8:1), p.headScale]);
    // arms (mirrored)
    def(limbSrc, [ armX, shoulderY, 0], [armThick, armLen/0.5, armThick], [0, 0, -0.32]);
    def(limbSrc, [-armX, shoulderY, 0], [armThick, armLen/0.5, armThick], [0, 0,  0.32]);
    // legs (mirrored) — merfolk replace legs with a fin
    if (!p.extras.fin) {
      def(limbSrc, [ 0.12, 0.25, 0], [1, 1, 1]);
      def(limbSrc, [-0.12, 0.25, 0], [1, 1, 1]);
    }

    // ---- race extras ----
    const ex = p.extras;
    if (ex.shoulderPads) {
      const padSrc = src(B.MeshBuilder.CreateBox('pad_'+S, { size:0.2 }, scene), stdMat('pad_'+S, civC), false);
      def(padSrc, [ armX+0.02, shoulderY+0.06, 0], [1,0.7,1.2]);
      def(padSrc, [-armX-0.02, shoulderY+0.06, 0], [1,0.7,1.2]);
    }
    if (ex.robe) {
      const robeSrc = src(B.MeshBuilder.CreateCylinder('robe_'+S, { height:bodyH*1.15, diameterTop:0.5*bsx, diameterBottom:0.78*bsx, tessellation:10 }, scene), stdMat('robe_'+S, civC, { emissive: civC.scale(0.18) }), true);
      def(robeSrc, [0, bodyY-0.04, 0]);
    }
    if (ex.armor) {
      const armSrc = src(B.MeshBuilder.CreateCylinder('arm_'+S, { height:bodyH*0.96, diameterTop:0.5, diameterBottom:0.56, tessellation:10 }, scene), stdMat('armor_'+S, hexC3('#8a8d94'), { metallic:true }), true);
      def(armSrc, [0, bodyY, 0], [bsx*1.05, 1, bsx*1.05]);
    }
    if (ex.helmet) {
      const helmSrc = src(B.MeshBuilder.CreateBox('helm_'+S, { width:0.46, height:0.28, depth:0.46 }, scene), stdMat('helm_'+S, hexC3('#9a9da4'), { metallic:true }), false);
      def(helmSrc, [0, headY+headR*0.55, 0], [p.headScale, p.headScale, p.headScale]);
    }
    if (ex.furCollar) {
      const furSrc = src(B.MeshBuilder.CreateTorus('fur_'+S, { diameter:0.55, thickness:0.14, tessellation:10 }, scene), stdMat('fur_'+S, hexC3('#eef3f8')), false);
      def(furSrc, [0, legH+bodyH-0.02, 0], [bsx,1,bsx]);
    }
    if (ex.belt) {
      const beltSrc = src(B.MeshBuilder.CreateTorus('belt_'+S, { diameter:bodyR*2.3, thickness:0.1, tessellation:10 }, scene), stdMat('belt_'+S, civC, { emissive:civC.scale(0.2) }), false);
      def(beltSrc, [0, bodyY-bodyH*0.15, 0]);
    }
    if (ex.horns) {
      const hornSrc = src(B.MeshBuilder.CreateCylinder('horn_'+S, { height:0.3, diameterTop:0, diameterBottom:0.12, tessellation:6 }, scene), stdMat('horn_'+S, hexC3('#2a1414')), false);
      def(hornSrc, [ 0.13*p.headScale, headY+headR*0.7, 0], [1,1,1], [0,0,-0.3]);
      def(hornSrc, [-0.13*p.headScale, headY+headR*0.7, 0], [1,1,1], [0,0, 0.3]);
    }
    if (ex.eyes) {
      const eyeSrc = src(B.MeshBuilder.CreateSphere('eye_'+S, { diameter:0.07, segments:4 }, scene), stdMat('eye_'+S, hexC3('#ff2a1a'), { emissive:hexC3('#ff2a1a'), disableLighting:true }), false);
      def(eyeSrc, [ 0.08, headY+0.02, headR*0.85]);
      def(eyeSrc, [-0.08, headY+0.02, headR*0.85]);
    }
    if (ex.tail) {
      const tailSrc = src(B.MeshBuilder.CreateCylinder('tail_'+S, { height:0.5, diameterTop:0.04, diameterBottom:0.16, tessellation:6 }, scene), stdMat('tail_'+S, bodyCol), false);
      def(tailSrc, [0, legH+0.12, -bodyR-0.14], [1,1,1], [-0.9,0,0]);
    }
    if (ex.wings) {
      const wingSrc = src(B.MeshBuilder.CreateBox('wing_'+S, { width:0.55, height:0.32, depth:0.04 }, scene), stdMat('wing_'+S, mix(civC, hexC3('#ffffff'), 0.3), { emissive: civC.scale(0.1) }), false);
      def(wingSrc, [ bodyR+0.05, shoulderY, -0.08], [1,1,1], [0, -0.5, 0.2]);
      def(wingSrc, [-bodyR-0.05, shoulderY, -0.08], [1,1,1], [0,  0.5, 0.2]);
    }
    if (ex.fourArms) {
      const sY2 = legH + bodyH * 0.45;
      def(limbSrc, [ armX, sY2, 0], [0.85, armLen/0.55, 0.85], [0,0,-0.5]);
      def(limbSrc, [-armX, sY2, 0], [0.85, armLen/0.55, 0.85], [0,0, 0.5]);
    }
    if (ex.fin) {
      const finSrc = src(B.MeshBuilder.CreateCylinder('fin_'+S, { height:0.5, diameterTop:0.42, diameterBottom:0.06, tessellation:8 }, scene), stdMat('fin_'+S, bodyCol), true);
      def(finSrc, [0, 0.25, 0]);
      const flukeSrc = src(B.MeshBuilder.CreateBox('fluke_'+S, { width:0.5, height:0.05, depth:0.18 }, scene), stdMat('fluke_'+S, mix(bodyCol, hexC3('#3a7ad0'), 0.4)), false);
      def(flukeSrc, [0, 0.03, 0]);
    }
    if (ex.leds) {
      const ledSrc = src(B.MeshBuilder.CreateBox('led_'+S, { size:0.07 }, scene), stdMat('led_'+S, civC, { emissive:civC, disableLighting:true }), false);
      def(ledSrc, [0,    bodyY+0.12, bodyR*0.9]);
      def(ledSrc, [0.12, bodyY-0.05, bodyR*0.9]);
      def(ledSrc, [-0.12,bodyY-0.05, bodyR*0.9]);
    }

    return { type:'procedural', profile:p, partDefs:defs, owned, mats:ownedMats, topY };
  }

  // AEON_DATA_HOOK: focus → unit type (index into FOCUS_UNIT_POOLS)
  function pickType(focus, i) {
    const pool = FOCUS_UNIT_POOLS[focus] || ['infantry'];
    return pool[i % pool.length];
  }

  // Focus → unit type now layers a subtle SIZE cue on top of the race silhouette
  // (race drives the shape; type nudges scale). Returns a uniform multiplier.
  function applyTypeScale(type) {
    switch (type) {
      case 'cavalry': return 1.12;   // bigger
      case 'archer':  return 0.92;   // slighter
      case 'mage':    return 1.0;    // + orb
      default:        return 1.0;    // infantry
    }
  }

  // AEON_DATA_HOOK: army(int) → rendered unit count.
  // PERFORMANCE: keep a sane on-screen cap; one instance "represents" many
  // soldiers. Bump the cap once you've moved soldiers to instances/VAT.
  function armyToUnits(army) {
    return clamp(Math.round(army / 220), 14, 64);
  }

  // Fae sparkle trail (capped to a few units — particle systems aren't free).
  function makeSparkle(node, hex) {
    const ps = new B.ParticleSystem('sparkle', 60, scene);
    ps.particleTexture = particleTex;
    ps.emitter = node;                                  // follows the soldier node
    ps.minEmitBox = new B.Vector3(-0.2, 0.4, -0.2);
    ps.maxEmitBox = new B.Vector3( 0.2, 1.4,  0.2);
    ps.blendMode = B.ParticleSystem.BLENDMODE_ADD;
    ps.color1 = col4(hex, 0.9); ps.color2 = col4('#ffffff', 0.8); ps.colorDead = col4(hex, 0);
    ps.minSize = 0.04; ps.maxSize = 0.12;
    ps.minLifeTime = 0.4; ps.maxLifeTime = 0.9;
    ps.emitRate = 16;
    ps.minEmitPower = 0.1; ps.maxEmitPower = 0.4;
    ps.gravity = new B.Vector3(0, 0.6, 0);
    ps.start();
    return ps;
  }

  /* ========================================================================
   *  UPGRADE 2 — TECH-AGE EVOLVING SETTLEMENTS
   *  buildSettlement(techAge, civColor, scene[, industry]) → TransformNode
   *  Built from stacked primitives; only 6–10 exist so they're plain meshes
   *  (not instanced). Animated bits register on node.metadata.anim.
   * ====================================================================== */
  function buildSettlement(techAge, civHex, sc, industry) {
    const node = new B.TransformNode('settlement', scene);
    node.metadata = { anim: [], meshes: [], mats: [], ps: [], t: 0 };
    const civC = hexC3(civHex);                         // AEON_DATA_HOOK: civ.color
    const add = (mesh, mat, x, y, z) => {
      mesh.material = mat; mesh.parent = node;
      if (x != null) mesh.position.set(x, y, z);
      mesh.receiveShadows = true; shadowGen.addShadowCaster(mesh);
      node.metadata.meshes.push(mesh);
      if (mat && node.metadata.mats.indexOf(mat) < 0) node.metadata.mats.push(mat);
      return mesh;
    };
    const M = (name, color, opts) => stdMat(name, color, opts);

    if (techAge <= 1) {
      // Age 0–1 — Hut: cylinder base + cone thatch roof (mud brown)
      add(B.MeshBuilder.CreateCylinder('hb', { height:0.8, diameter:2, tessellation:12 }, scene), M('mud', hexC3('#6b4f33')), 0, 0.4, 0);
      add(B.MeshBuilder.CreateCylinder('hr', { height:0.6, diameterTop:0, diameterBottom:2.2, tessellation:12 }, scene), M('thatch', hexC3('#9a7b48')), 0, 1.1, 0);
    } else if (techAge === 2) {
      // Age 2 — Longhouse: box + ridge roof (inverted-V of two angled boxes)
      add(B.MeshBuilder.CreateBox('lh', { width:3, height:0.8, depth:1.5 }, scene), M('wood', hexC3('#6b4a2f')), 0, 0.4, 0);
      const roofMat = M('roof', hexC3('#5a3d28'));
      const r1 = add(B.MeshBuilder.CreateBox('r1', { width:3, height:0.1, depth:1.05 }, scene), roofMat, 0, 0.98, 0.42);  r1.rotation.x =  0.62;
      const r2 = add(B.MeshBuilder.CreateBox('r2', { width:3, height:0.1, depth:1.05 }, scene), roofMat, 0, 0.98, -0.42); r2.rotation.x = -0.62;
    } else if (techAge === 3) {
      // Age 3 — Stone Keep: tall box + 4 corner battlements + side tower
      add(B.MeshBuilder.CreateBox('keep', { width:1.5, height:2, depth:1.5 }, scene), M('stone', hexC3('#7d7f86')), 0, 1, 0);
      const bm = M('batt', hexC3('#6b6d74'));
      [[-0.6,-0.6],[0.6,-0.6],[-0.6,0.6],[0.6,0.6]].forEach((c,i) => add(B.MeshBuilder.CreateBox('bt'+i, { size:0.35 }, scene), bm, c[0], 2.1, c[1]));
      add(B.MeshBuilder.CreateCylinder('twr', { height:2.6, diameter:0.7, tessellation:10 }, scene), M('twr', hexC3('#73757c')), 1.0, 1.3, 0);
    } else if (techAge === 4) {
      // Age 4 — Town Hall: wide box + arched window cutouts + dome
      add(B.MeshBuilder.CreateBox('th', { width:3, height:1.5, depth:2 }, scene), M('plaster', hexC3('#b9ab8f')), 0, 0.75, 0);
      const win = M('win', hexC3('#23252b'));
      for (let i = -1; i <= 1; i++) add(B.MeshBuilder.CreateBox('w'+i, { width:0.3, height:0.7, depth:0.06 }, scene), win, i*0.9, 0.8, 1.01);
      add(B.MeshBuilder.CreateSphere('dome', { diameter:1.2, segments:12, slice:0.5 }, scene), M('dome', civC, { emissive: civC.scale(0.1) }), 0, 1.5, 0);
    } else if (techAge === 5) {
      // Age 5 — Factory: wide box + smokestacks (emissive tops) + spinning gear
      add(B.MeshBuilder.CreateBox('fac', { width:3.2, height:1.2, depth:2 }, scene), M('brick', hexC3('#4a3a34')), 0, 0.6, 0);
      const stackMat = M('stack', hexC3('#3a2f2b'));
      const glowMat  = M('sglow', hexC3('#ff7a2a'), { emissive: hexC3('#ff7a2a'), disableLighting:true });
      const stacks = industry ? 3 : 2;                  // AEON_DATA_HOOK: industry → extra smokestack
      for (let i = 0; i < stacks; i++) {
        const sx = -0.8 + i * 0.8;
        add(B.MeshBuilder.CreateCylinder('st'+i, { height:2, diameter:0.4, tessellation:8 }, scene), stackMat, sx, 1.6, -0.4);
        add(B.MeshBuilder.CreateCylinder('sg'+i, { height:0.18, diameter:0.44, tessellation:8 }, scene), glowMat, sx, 2.6, -0.4);
      }
      const gear = add(B.MeshBuilder.CreateCylinder('gear', { height:0.12, diameter:1, tessellation:12 }, scene), M('gear', hexC3('#6b5a45')), 1.2, 1.0, 1.05);
      gear.rotation.x = Math.PI / 2;
      node.metadata.anim.push({ type:'spin', mesh:gear, speed:1.2 });
    } else if (techAge === 6) {
      // Age 6 — Office Block: tall glass slab (specular/blue) + window grid
      const glass = M('glass', hexC3('#3a5d7a'));
      glass.specularColor = new B.Color3(0.8, 0.85, 0.95); glass.specularPower = 128; glass.alpha = 0.96;
      add(B.MeshBuilder.CreateBox('off', { width:2, height:3, depth:1 }, scene), glass, 0, 1.5, 0);
      const line = M('mull', hexC3('#1a2230'));
      for (let y = 0; y < 5; y++) add(B.MeshBuilder.CreateBox('gl'+y, { width:2.02, height:0.05, depth:1.02 }, scene), line, 0, 0.5 + y*0.55, 0);
    } else {
      // Age 7+ — Megastructure: towers + emissive panels + floating orb + beam
      const towerMat = M('mega', hexC3('#2a3550'));
      const panelMat = M('panel', civC, { emissive: civC.scale(industry ? 1.0 : 0.7), disableLighting:true });
      add(B.MeshBuilder.CreateBox('mt1', { width:0.9, height:3.4, depth:0.9 }, scene), towerMat, -0.9, 1.7, 0);
      add(B.MeshBuilder.CreateBox('mt2', { width:0.9, height:2.6, depth:0.9 }, scene), towerMat,  0.9, 1.3, 0);
      add(B.MeshBuilder.CreateBox('p1',  { width:0.95, height:0.5, depth:0.95 }, scene), panelMat, -0.9, 2.6, 0);
      add(B.MeshBuilder.CreateBox('p2',  { width:0.95, height:0.5, depth:0.95 }, scene), panelMat,  0.9, 2.0, 0);
      const beamMat = M('beam', civC, { emissive: civC, disableLighting:true });
      const beam = add(B.MeshBuilder.CreateCylinder('beam', { height:1.8, diameter:0.12, tessellation:6 }, scene), beamMat, 0, 2.3, 0);
      beam.rotation.z = Math.PI / 2;                     // connect the two towers
      node.metadata.anim.push({ type:'pulse', mat:beamMat, base:civC });
      const orb = add(B.MeshBuilder.CreateIcoSphere('mfloat', { radius:0.4, subdivisions:1 }, scene), panelMat, 0, 3.4, 0);
      node.metadata.anim.push({ type:'float', mesh:orb, baseY:3.4 });
    }

    // industry bonus: brighten emissive on any Age 5+ settlement
    if (industry && techAge >= 5) {
      for (const m of node.metadata.mats) if (m.emissiveColor) m.emissiveColor = clampC(m.emissiveColor.scale(1.6));
    }
    return node;
  }

  function disposeSettlement(rec) {
    const node = rec && rec.node; if (!node) return;
    const md = node.metadata || {};
    if (md.ps)     for (const ps of md.ps) { try { ps.dispose(); } catch (e) {} }
    if (md.meshes) for (const m of md.meshes) m.dispose();
    if (md.mats)   for (const m of md.mats) m.dispose();
    node.dispose();
  }

  function updateSettlementAnim(node, dt) {
    const md = node.metadata; if (!md || !md.anim || !md.anim.length) return;
    md.t += dt;
    for (const a of md.anim) {
      if      (a.type === 'spin')  a.mesh.rotate(B.Axis.Y, a.speed * dt, B.Space.LOCAL);
      else if (a.type === 'float') a.mesh.position.y = a.baseY + Math.sin(md.t * 1.5) * 0.2;
      else if (a.type === 'pulse') a.mat.emissiveColor = a.base.scale(0.5 + 0.5 * Math.abs(Math.sin(md.t * 2)));
    }
  }

  /* ========================================================================
   *  OVERLAY HELPERS (HTML, not in-scene)
   * ====================================================================== */
  function flashScreen(toAlpha) {
    const f = $('flash');
    f.style.transition = 'none';
    f.style.opacity = String(toAlpha);
    // next frame: fade out (cosmetic only — decoupled from the deterministic sim)
    requestAnimationFrame(() => {
      f.style.transition = 'opacity 0.5s ease';
      f.style.opacity = '0';
    });
  }
  function renderLog(logArr) {
    const el = $('log');
    el.innerHTML = logArr.slice(-6).map(e =>
      `<div class="lt"><b>Y${e.year}</b> · ${escapeHtml(e.text)}</div>`).join('');
  }
  function log(text) { /* pre-battle messages */ renderLog([{ year:'—', text }]); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  /* ========================================================================
   *  BOOTSTRAP
   * ====================================================================== */
  async function boot() {
    createScene();

    $('loadmsg').textContent = 'Loading assets…';
    // Load templates up front (both gracefully fall back to primitives).
    soldierTmpl  = await loadSoldier();
    buildingTmpl = await loadBuilding();

    startBattle3D();

    // Battle3D owns its own render loop (unlike the canvas BattleVisualizer,
    // which is stepped from main.js's gameLoop()). On integration, fire an
    // onDone() callback here that the orchestrator binds to finishGame().
    let last = performance.now();
    engine.runRenderLoop(() => {
      const now = performance.now();
      const dt = (now - last) / 1000; last = now;
      if (battle) battle.step(dt);
      updateTerrainAnim(dt);          // UPGRADE 3: heat-shimmer / water ripple
      scene.render();
    });

    window.addEventListener('resize', () => engine.resize());
    populateBiomeSelect();
    wireControls();
    $('loading').classList.add('hidden');
  }

  function startBattle3D() {
    if (battle) battle.dispose();
